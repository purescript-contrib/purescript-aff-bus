package:
  name: aff-bus
  description: Many-to-many broadcasting
  publish:
    version: 6.0.1
    license: Apache-2.0
    location:
      githubOwner: purescript-contrib
      githubRepo: purescript-aff-bus
  build:
    strict: true
  dependencies:
    - aff: ">=7.0.0 <9.0.0"
    - avar: ">=5.0.0 <6.0.0"
    - effect: ">=4.0.0 <5.0.0"
    - exceptions: ">=6.0.0 <7.0.0"
    - foldable-traversable: ">=6.0.0 <7.0.0"
    - lists: ">=7.0.0 <8.0.0"
    - prelude: ">=6.0.0 <7.0.0"
    - tailrec: ">=6.0.0 <7.0.0"
    - tuples: ">=7.0.0 <8.0.0"
  test:
    main: Test.Main
    strict: true
    dependencies:
      - console
      - either
      - refs
      - transformers

workspace:
  packageSet:
    registry: 81.4.0
